<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cardápio — WCS Pedidos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:24px 18px;text-align:center}header h1{margin:0;font-size:26px}header p{margin:8px 0 0;color:#d1d5db}
main{max-width:900px;margin:24px auto;padding:0 16px}.status{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:18px;color:#6b7280}
.category{margin:26px 0}.category h2{font-size:21px;margin:0 0 12px}.product{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.product img{width:95px;height:95px;object-fit:cover;border-radius:10px;background:#e5e7eb}.info{flex:1}.info h3{margin:0 0 5px}.info p{margin:0 0 8px;color:#6b7280;font-size:14px}.price{font-weight:bold;color:#16a34a;font-size:18px}
.add{border:0;background:#16a34a;color:#fff;padding:10px 13px;border-radius:9px;font-weight:bold;cursor:pointer}.empty{text-align:center;padding:40px;background:#fff;border-radius:14px}
.cart{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;border:0;border-radius:14px;padding:15px 22px;font-weight:bold;box-shadow:0 8px 25px rgba(0,0,0,.25);cursor:pointer}
.back{display:inline-block;margin-top:12px;color:#111827;text-decoration:none}
</style>
</head>
<body>
<header><h1 id="storeName">Carregando...</h1><p id="storeDescription"></p></header>
<main>
<div id="status" class="status">Carregando cardápio...</div>
<div id="menu"></div>
<a class="back" href="index.html">← Voltar</a>
</main>
<button class="cart" id="cart">🛒 Carrinho: <span id="cartCount">0</span></button>
<script>
const SUPABASE_URL="https://ikhwsuofjmsqtjmjytzg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_OJ4FLmLOfPB-iezUDRI2-A_RiodfJ_V";
const STORE_SLUG=new URLSearchParams(location.search).get("loja")||"loja-teste";
const TEST_COMPANY_ID="e3182b21-7d45-4d73-81e1-f2beb399fa9a";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let companyId=null,cartCount=0;

const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function status(t){document.getElementById("status").textContent=t}
function add(){cartCount++;document.getElementById("cartCount").textContent=cartCount}

async function loadStore(){
const {data,error}=await supabaseClient.from("companies").select("*").eq("slug",STORE_SLUG).maybeSingle();
if(error){console.error(error);status("Não foi possível carregar a loja.");return false}
companyId=(data&&data.id)||TEST_COMPANY_ID;
if(data){document.getElementById("storeName").textContent=data.name||"WCS Pedidos";document.getElementById("storeDescription").textContent=data.description||""}
return true;
}
async function loadMenu(){
const {data:cats,error:ce}=await supabaseClient.from("categories").select("id,name,description,display_order").eq("company_id",companyId).eq("is_active",true).order("display_order",{ascending:true});
if(ce){console.error(ce);status("Erro ao carregar categorias.");return}
const {data:products,error:pe}=await supabaseClient.from("products").select("id,category_id,name,description,price,image_url,display_order").eq("company_id",companyId).eq("is_active",true).order("display_order",{ascending:true});
if(pe){console.error(pe);status("Erro ao carregar produtos.");return}
const menu=document.getElementById("menu");menu.innerHTML="";
if(!cats||!cats.length){menu.innerHTML='<div class="empty">Nenhuma categoria disponível.</div>';status("Cardápio carregado.");return}
for(const cat of cats){
const ps=(products||[]).filter(p=>p.category_id===cat.id);if(!ps.length)continue;
const sec=document.createElement("section");sec.className="category";
sec.innerHTML="<h2>"+cat.name+"</h2>";
ps.forEach(p=>{
const item=document.createElement("div");item.className="product";
const image=p.image_url?'<img src="'+p.image_url+'" alt="">':'<div style="width:95px;height:95px;border-radius:10px;background:#e5e7eb"></div>';
item.innerHTML=image+'<div class="info"><h3>'+p.name+'</h3><p>'+((p.description)||"")+'</p><div class="price">'+money(p.price)+'</div></div><button class="add">Adicionar</button>';
item.querySelector(".add").onclick=add;sec.appendChild(item);
});
menu.appendChild(sec);
}
status("Cardápio carregado.");
}
(async()=>{if(await loadStore())await loadMenu()})();
document.getElementById("cart").onclick=()=>alert("Carrinho em preparação para a próxima etapa.");
</script>
</body>
</html>
