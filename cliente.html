<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cardápio — WCS Pedidos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a}
header{background:#0f172a;color:#fff;padding:25px 18px;text-align:center}
header h1{margin:0;font-size:28px}header p{color:#cbd5e1;margin:8px 0 0}
main{max-width:920px;margin:22px auto;padding:0 15px}
.status,.cat{background:#fff;border-radius:15px;padding:15px;margin-bottom:15px}
.status{font-weight:700}
.product{background:#fff;border-radius:14px;padding:13px;display:flex;gap:13px;align-items:center;margin:10px 0;box-shadow:0 3px 12px #0000000d}
.product img,.ph{width:92px;height:92px;border-radius:10px;object-fit:cover;background:#e2e8f0}
.info{flex:1}.info h3{margin:0 0 5px}.desc{color:#64748b;font-size:14px;margin:5px 0}
.price{font-weight:800;color:#16a34a;font-size:17px}.add,.confirm{border:0;background:#16a34a;color:#fff;padding:10px 13px;border-radius:9px;font-weight:800;cursor:pointer}
.add:active,.confirm:active{transform:scale(.98)}
.cart{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);border:0;background:#111827;color:#fff;padding:15px 22px;border-radius:14px;font-weight:800;cursor:pointer;z-index:9;box-shadow:0 6px 22px #0004}
.drawer{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.drawer.show{display:flex}
.sheet{background:white;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;margin:auto}
.close{float:right;border:0;padding:9px;border-radius:8px;cursor:pointer}
.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e2e8f0}
.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border:0;border-radius:7px;background:#e2e8f0;cursor:pointer;font-weight:800}
.remove{border:0;background:#fee2e2;color:#991b1b;border-radius:7px;padding:7px;cursor:pointer}
.total{font-size:20px;font-weight:900;text-align:right;margin:16px 0}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybox{border:1px solid #dbe3ed;border-radius:11px;padding:12px;margin-top:10px;background:#f8fafc}
.paybox label{margin:0 0 7px}.hint{font-size:12px;color:#64748b;margin-top:6px}
.confirm{width:100%;margin-top:15px;font-size:15px}.confirm.mp{background:#2563eb}
.msg{display:none;padding:11px;border-radius:9px;margin-top:10px}
.empty{text-align:center;color:#64748b;padding:18px}
@media(max-width:600px){.row{grid-template-columns:1fr}.product{align-items:flex-start}.product img,.ph{width:76px;height:76px}.cartrow{grid-template-columns:1fr auto}.remove{grid-column:2}}
</style>
</head>
<body>

<header>
  <h1 id="store">Carregando...</h1>
  <p id="desc"></p>
</header>

<main>
  <div id="status" class="status">Carregando cardápio...</div>
  <div id="menu"></div>
</main>

<button class="cart" id="openCart">🛒 Carrinho (<span id="count">0</span>)</button>

<div class="drawer" id="drawer">
  <div class="sheet">
    <button class="close" id="close">Fechar</button>
    <h2>Seu pedido</h2>

    <div id="cartList"></div>
    <div id="total" class="total">Total: R$ 0,00</div>

    <hr>

    <label for="cName">Nome</label>
    <input id="cName" autocomplete="name" placeholder="Seu nome">

    <label for="cPhone">Telefone</label>
    <input id="cPhone" autocomplete="tel" placeholder="(00) 00000-0000">

    <div class="row">
      <div>
        <label for="delivery">Tipo</label>
        <select id="delivery">
          <option value="delivery">Entrega</option>
          <option value="pickup">Retirada</option>
        </select>
      </div>
      <div>
        <label for="payment">Pagamento</label>
        <select id="payment">
          <option value="mercadopago">Mercado Pago</option>
          <option value="cash">Dinheiro</option>
          <option value="card_delivery">Cartão na entrega/retirada</option>
        </select>
      </div>
    </div>

    <div id="mpBox" class="paybox">
      <strong>💳 Mercado Pago</strong>
      <div class="hint">Você será encaminhado ao ambiente seguro do Mercado Pago para concluir o pagamento.</div>
    </div>

    <label for="address">Endereço</label>
    <input id="address" autocomplete="street-address" placeholder="Rua, número, bairro">

    <label for="notes">Observações</label>
    <textarea id="notes" placeholder="Ex.: sem cebola, tocar a campainha..."></textarea>

    <button class="confirm mp" id="send">FINALIZAR E PAGAR COM MERCADO PAGO</button>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
const SB_URL="https://ikhwsuofjmsqtjmjytzg.supabase.co";
const SB_KEY="sb_publishable_OJ4FLmLOfPB-iezUDRI2-A_RiodfJ_V";
const sb=supabase.createClient(SB_URL,SB_KEY);

const fallback="e3182b21-7d45-4d73-81e1-f2beb399fa9a";
const slug=new URLSearchParams(location.search).get("loja")||"loja-teste";

let companyId=fallback, products=[], cart=[];

const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function showMsg(text,error=false){
  $("msg").textContent=text;
  $("msg").style.display="block";
  $("msg").style.background=error?"#fee2e2":"#dcfce7";
  $("msg").style.color=error?"#991b1b":"#166534";
}

async function init(){
  try{
    const c=await sb.from("companies").select("*").eq("slug",slug).maybeSingle();
    if(c.data){
      companyId=c.data.id;
      $("store").textContent=c.data.name||"WCS Pedidos";
      $("desc").textContent=c.data.description||"";
    }

    const cats=await sb.from("categories").select("*")
      .eq("company_id",companyId).eq("is_active",true).order("display_order");

    const ps=await sb.from("products").select("*")
      .eq("company_id",companyId).eq("is_active",true).order("display_order");

    if(ps.error) throw ps.error;
    products=ps.data||[];
    $("menu").innerHTML="";

    (cats.data||[]).forEach(cat=>{
      const list=products.filter(p=>p.category_id===cat.id);
      if(!list.length)return;

      const sec=document.createElement("section");
      sec.className="cat";
      sec.innerHTML=`<h2>${esc(cat.name)}</h2>`;

      list.forEach(p=>{
        const el=document.createElement("div");
        el.className="product";
        el.innerHTML=
          `${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:'<div class="ph"></div>'}
          <div class="info">
            <h3>${esc(p.name)}</h3>
            <p class="desc">${esc(p.description)}</p>
            <div class="price">${money(p.price)}</div>
          </div>
          <button class="add">Adicionar</button>`;
        el.querySelector(".add").onclick=()=>add(p.id);
        sec.appendChild(el);
      });

      $("menu").appendChild(sec);
    });

    $("status").textContent=products.length?"Cardápio disponível":"Nenhum produto disponível";
  }catch(e){
    console.error(e);
    $("status").textContent="Não foi possível carregar o cardápio.";
  }
}

function add(id){
  const x=cart.find(i=>i.id===id);
  if(x)x.qty++;
  else cart.push({id,qty:1});
  render();
}

function changeQty(id,delta){
  const x=cart.find(i=>i.id===id);
  if(!x)return;
  x.qty+=delta;
  if(x.qty<=0)cart=cart.filter(i=>i.id!==id);
  render();
}

function render(){
  let total=0,n=0;

  if(!cart.length){
    $("cartList").innerHTML='<div class="empty">Carrinho vazio.</div>';
  }else{
    $("cartList").innerHTML=cart.map(i=>{
      const p=products.find(x=>x.id===i.id);
      if(!p)return "";
      total+=Number(p.price)*i.qty;
      n+=i.qty;
      return `
        <div class="cartrow">
          <div><strong>${esc(p.name)}</strong><br>${money(p.price)} cada</div>
          <div class="qty">
            <button onclick="changeQty('${i.id}',-1)">−</button>
            <strong>${i.qty}</strong>
            <button onclick="changeQty('${i.id}',1)">+</button>
          </div>
          <button class="remove" onclick="changeQty('${i.id}',-${i.qty})">Excluir</button>
        </div>`;
    }).join("");
  }

  $("count").textContent=n;
  $("total").textContent="Total: "+money(total);
}

$("openCart").onclick=()=>{
  $("drawer").classList.add("show");
  render();
};

$("close").onclick=()=>$("drawer").classList.remove("show");

$("payment").onchange=()=>{
  const mp=$("payment").value==="mercadopago";
  $("mpBox").style.display=mp?"block":"none";
  $("send").classList.toggle("mp",mp);
  $("send").textContent=mp?"FINALIZAR E PAGAR COM MERCADO PAGO":"FINALIZAR PEDIDO";
};

$("delivery").onchange=()=>{
  $("address").disabled=$("delivery").value==="pickup";
  if($("address").disabled)$("address").value="";
};

async function createCustomer(name,phone){
  const r=await sb.from("customers").insert({
    company_id:companyId,name,phone
  }).select("id").single();
  if(r.error)throw r.error;
  return r.data.id;
}

async function createOrder(customerId,name,phone){
  let total=0;
  for(const i of cart){
    const p=products.find(x=>x.id===i.id);
    total+=Number(p.price)*i.qty;
  }

  const r=await sb.from("orders").insert({
    company_id:companyId,
    customer_id:customerId,
    customer_name:name,
    customer_phone:phone,
    status:"pending",
    total,
    delivery_type:$("delivery").value,
    delivery_address:$("address").value.trim(),
    notes:$("notes").value.trim(),
    payment_method:$("payment").value
  }).select("id").single();

  if(r.error)throw r.error;

  for(const i of cart){
    const p=products.find(x=>x.id===i.id);
    const item=await sb.from("order_items").insert({
      order_id:r.data.id,
      product_id:p.id,
      quantity:i.qty,
      unit_price:p.price,
      total:Number(p.price)*i.qty
    });

    if(item.error)throw item.error;
  }

  return {orderId:r.data.id,total};
}

$("send").onclick=async()=>{
  try{
    if(!cart.length)return showMsg("Carrinho vazio.",true);

    const name=$("cName").value.trim();
    const phone=$("cPhone").value.trim();
    const delivery=$("delivery").value;
    const payment=$("payment").value;

    if(!name||!phone)return showMsg("Informe nome e telefone.",true);
    if(delivery==="delivery"&&!$("address").value.trim())
      return showMsg("Informe o endereço para entrega.",true);

    $("send").disabled=true;
    $("send").textContent="PROCESSANDO...";

    const customerId=await createCustomer(name,phone);
    const order=await createOrder(customerId,name,phone);

    if(payment==="mercadopago"){
      const {data,error}=await sb.functions.invoke("criar-pagamento",{
        body:{order_id:order.orderId}
      });

      if(error)throw error;
      if(!data?.checkout_url)
        throw new Error(data?.error||"O Mercado Pago não retornou a URL de pagamento.");

      localStorage.setItem("wcs_ultimo_pedido",order.orderId);
      window.location.href=data.checkout_url;
      return;
    }

    cart=[];
    render();
    showMsg("Pedido enviado com sucesso!",false);
    $("send").disabled=false;
    $("send").textContent="FINALIZAR PEDIDO";
  }catch(e){
    console.error(e);
    showMsg(e.message||"Não foi possível finalizar o pedido.",true);
    $("send").disabled=false;
    $("send").textContent=$("payment").value==="mercadopago"?"FINALIZAR E PAGAR COM MERCADO PAGO":"FINALIZAR PEDIDO";
  }
};

init();
render();
</script>
</body>
</html>
