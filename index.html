<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Online</title>

  <style>
    :root {
      --primary: #111827;
      --secondary: #ffffff;
      --button-color: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: var(--primary);
      color: var(--secondary);
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    .category {
      margin-top: 28px;
    }

    .category h2 {
      margin-bottom: 12px;
      font-size: 22px;
    }

    .product {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      gap: 14px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      background: #e5e7eb;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
    }

    .product h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .product p {
      margin: 0 0 10px;
      color: #6b7280;
      line-height: 1.4;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      background: var(--button-color);
      color: #fff;
    }

    .cart {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: 868px;
      margin: auto;
      background: var(--button-color);
      color: #fff;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 20px;
    }

    .error {
      color: #b91c1c;
    }

    @media (max-width: 600px) {
      .product img {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 id="store-name">Carregando...</h1>
    <p id="store-description"></p>
  </header>

  <main>
    <div id="menu" class="loading">Carregando cardápio...</div>
  </main>

  <div class="cart">
    <span>🛒 Carrinho: <strong id="cart-count">0</strong></span>
    <button onclick="alert('Carrinho será desenvolvido no próximo passo.')">
      Ver carrinho
    </button>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ikhwsuofjmsqtjmjytzg.supabase.co";
   const SUPABASE_KEY = "sb_publishable_OJ4FLmLOfPB-iezUDRI2-A_RiodfJ_V";

    const STORE_SLUG = "loja-teste";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let cart = [];

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatPrice(value) {
      return Number(value || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    async function loadStore() {
      const { data, error } = await supabase
  .from("companies")
  .select("id,name,description,primary_color,secondary_color,button_color")
  


      if (error) throw error;

      document.documentElement.style.setProperty("--primary", data.primary_color || "#111827");
      document.documentElement.style.setProperty("--secondary", data.secondary_color || "#ffffff");
      document.documentElement.style.setProperty("--button-color", data.button_color || "#16a34a");

      document.getElementById("store-name").textContent = data.name;
      document.getElementById("store-description").textContent = data.description || "";

      return data;
    }

    async function loadMenu(companyId) {
      const { data: categories, error: categoryError } = await supabase
        .from("categories")
        .select("id,name,description,display_order")
        .eq("company_id", companyId)
  
        .order("display_order", { ascending: true });

      if (categoryError) throw categoryError;

      const { data: products, error: productError } = await supabase
        .from("products")
        .select("id,category_id,name,description,price,image_url,display_order")
        .eq("company_id", companyId)
       
        .order("display_order", { ascending: true });

      if (productError) throw productError;

      const menu = document.getElementById("menu");
      menu.className = "";

      if (!categories || categories.length === 0) {
        menu.innerHTML = "<div class='loading'>Nenhuma categoria cadastrada.</div>";
        return;
      }

      menu.innerHTML = categories.map(category => {
        const categoryProducts = products.filter(
          product => product.category_id === category.id
        );

        return `
          <section class="category">
            <h2>${escapeHtml(category.name)}</h2>
            ${category.description ? `<p>${escapeHtml(category.description)}</p>` : ""}
            ${categoryProducts.map(product => `
              <article class="product">
                ${
                  product.image_url
                    ? `<img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}">`
                    : `<div style="width:110px;height:110px;border-radius:10px;background:#e5e7eb;"></div>`
                }

                <div class="product-info">
                  <h3>${escapeHtml(product.name)}</h3>
                  <p>${escapeHtml(product.description || "")}</p>
                  <div class="price">${formatPrice(product.price)}</div>

                  <button onclick="addToCart('${product.id}', '${escapeHtml(product.name)}', ${Number(product.price)})">
                    Adicionar
                  </button>
                </div>
              </article>
            `).join("")}
          </section>
        `;
      }).join("");
    }

    window.addToCart = function(id, name, price) {
      cart.push({ id, name, price });
      document.getElementById("cart-count").textContent = cart.length;
    };

    async function init() {
      try {
        const store = await loadStore();
        await loadMenu(store.id);
      } catch (error) {
        console.error(error);

        document.getElementById("menu").innerHTML = `
          <div class="error">
            <h2>Não foi possível carregar o cardápio.</h2>
            <p>${escapeHtml(error.message || "Erro desconhecido.")}</p>
          </div>
        `;
      }
    }

    init();
  </script>

</body>
</html>
