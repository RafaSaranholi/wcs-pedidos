<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WCS Pedidos</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#111827,#1f2937);display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:40px 28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{width:90px;height:90px;margin:0 auto 20px;border-radius:22px;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold}
h1{margin:0;font-size:30px;color:#111827}.subtitle{margin:10px 0 32px;color:#6b7280;font-size:16px}
.option{width:100%;border:0;border-radius:14px;padding:18px;margin-top:14px;cursor:pointer;font-size:17px;font-weight:bold;transition:.15s}
.option:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.cliente{background:#16a34a;color:#fff}.proprietario{background:#111827;color:#fff}.footer{margin-top:30px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="container">
<div class="logo">W</div>
<h1>WCS Pedidos</h1>
<div class="subtitle">Cardápio e pedidos online</div>
<button class="option cliente" onclick="location.href='cliente.html?loja=loja-teste'">👤 SOU CLIENTE</button>
<button class="option proprietario" onclick="location.href='admin.html'">🏪 SOU PROPRIETÁRIO</button>
<div class="footer">Plataforma WCS Pedidos</div>
</div>
</body>
</html>
