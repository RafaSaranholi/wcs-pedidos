<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WCS Pedidos — Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:bold}.logout{border:0;background:#374151;color:#fff;padding:10px 16px;border-radius:9px;cursor:pointer;font-weight:bold}
main{max-width:1100px;margin:30px auto;padding:0 20px}.welcome{background:#fff;border-radius:16px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,.06)}
h1{margin:0 0 8px;font-size:28px}p{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:22px}
.box{background:#fff;border-radius:16px;padding:22px;box-shadow:0 5px 20px rgba(0,0,0,.06)}.box h2{margin:0 0 8px;font-size:18px}.box span{color:#6b7280;font-size:14px}
</style>
</head>
<body>
<header><div class="brand">WCS Pedidos</div><button class="logout" id="logout">Sair</button></header>
<main>
<section class="welcome"><h1>Painel do Proprietário</h1><p id="userInfo">Carregando...</p></section>
<section class="grid">
<div class="box"><h2>🏪 Minha Loja</h2><span>Configurações da loja</span></div>
<div class="box"><h2>📂 Categorias</h2><span>Gerenciar categorias</span></div>
<div class="box"><h2>🍔 Produtos</h2><span>Gerenciar produtos e preços</span></div>
<div class="box"><h2>🛒 Pedidos</h2><span>Visualizar pedidos</span></div>
</section>
</main>
<script>
const SUPABASE_URL="https://ikhwsuofjmsqtjmjytzg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_OJ4FLmLOfPB-iezUDRI2-A_RiodfJ_V";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
(async()=>{
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session){location.href="admin.html";return}
document.getElementById("userInfo").textContent="Usuário conectado: "+(session.user.email||"usuário autenticado");
})();
document.getElementById("logout").onclick=async()=>{await supabaseClient.auth.signOut();location.href="index.html"};
</script>
</body>
</html>
